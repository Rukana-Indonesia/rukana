services:
  mysql:
    image: mysql:8.4
    container_name: rukana-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rukana
      MYSQL_USER: rukana
      MYSQL_PASSWORD: rukana
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
